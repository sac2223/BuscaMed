<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- /* establece la codificación de caracteres y la configuración de la ventana gráfica para dispositivos móviles */ -->
    <title>BuscaMed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
 <div class="contenedor"> <!--/* crea un contenedor principal para el contenido de la página */ -->
    <div class="logo">
         <span class="rojo">✚</span> BuscaMed
    </div>
    <h1> Iniciar sesión</h1>
    <p> Accede a tu cuenta de farmacia </p> <!--/* crea un párrafo que indica a los usuarios que pueden acceder a su cuenta de farmacia */-->

    <form class="forma">

       <label> Correo electrónico</label> <!--/* crea un campo de entrada para el correo electrónico del usuario con un marcador de posición y lo hace obligatorio */-->
        <input type="email" placeholder="Ejemplo@correo.com" required >

       <label>Contraseña</label> <!--/* crea un campo de entrada para la contraseña del usuario con un marcador de posición y lo hace obligatorio */-->
        <input type="password" placeholder="Ejemplo123" required>

        <a href="#">¿Olvidaste tu contraseña?</a>

        <button class= 'boton_inicio' type="submit">Iniciar sesión</button> <!--/* crea un botón de envío para el formulario con el texto "Iniciar sesión" */-->

    </form>

    <hr> <!--/* crea una línea horizontal para separar visualmente el formulario de inicio de sesión del enlace de registro */-->

    <p class="registro">¿No tienes una cuenta? <a href="registro.html">Registrate como farmacia</a> <!--/* crea un párrafo con un enlace para los usuarios que no tienen una cuenta, invitándolos a registrarse como farmacia */-->
    </p>

 </div>

</body>
</html>
