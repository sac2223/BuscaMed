<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="actualizar-stock.css">
    <title>Destacar producto - BuscaMed</title>
</head>

<body>

    <header class="encabezado">
        <h1> <span class="cruz"> + </span> BuscaMed</h1>
        <div class="farmacia">
            <span>Farmacia Salud y Vida</span>
        </div>
    </header>

    <div class="contenedor">
        <nav class="menu">
            <ul>
                <li><a href="farmacia.html">Inicio</a></li>
                <li><a href="actualizar-stock.html">Inventario</a></li>
                <li><a href="actualizar-precios.html">Precios</a></li>
                <li><a href="alertas.html">Alertas</a></li>
                <li><a href="informacion-farmacia.html">Información</a></li>
                <li><a href="index.html">Cerrar sesión</a></li>
            </ul>
        </nav>

        <main>
            <h2>Destacar producto</h2>

            <form>
                <label for="medicamento">Selecciona un medicamento</label>

                <select id="medicamento">
                    <option value="">Seleccionar medicamento</option>
                    <option value="acetaminofen">Acetaminofén</option>
                    <option value="ibuprofeno">Ibuprofeno</option>
                    <option value="loratadina">Loratadina</option>
                </select>

                <p>El medicamento seleccionado tendrá mayor visibilidad en BuscaMed.</p>

                <button type="submit">Destacar producto</button>
            </form>
        </main>

    </div>

</body>

</html>
