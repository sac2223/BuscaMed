<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar farmacia | BuscaMed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor registro-contenedor">
        <div class="logo"><span class="rojo" aria-hidden="true">✚</span> BuscaMed</div>

        <h1>Registro de farmacia</h1>
        <p>Registra tu farmacia para hacer parte de BuscaMed</p>

        <form action="#" method="post">
            <label for="farmacia">Nombre de la farmacia</label>
            <input type="text" id="farmacia" name="farmacia" placeholder="Ej. Farmacia San José" required>

            <label for="nit">NIT</label>
            <input type="text" id="nit" name="nit" placeholder="Ej. 123456789-0" pattern="[0-9]{8,10}-?[0-9]" title="Ejemplo: 123456789-0" required>

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" placeholder="Ej. Calle 123 # 45-67" autocomplete="street-address" required>

            <label for="ciudad">Ciudad</label>
            <select id="ciudad" name="ciudad" required>
                <option value="">Selecciona una ciudad</option>
                <option>Medellín</option>
                <option>Bogotá</option>
                <option>Cali</option>
                <option>Barranquilla</option>
                <option>Cartagena</option>
            </select>

            <label for="responsable">Nombre del responsable</label>
            <input type="text" id="responsable" name="responsable" placeholder="Ej. Juan Pérez" autocomplete="name" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="Ej. farmacia@correo.com" autocomplete="email" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 300 123 4567" autocomplete="tel" required>

            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="new-password" required>
              <h2>Subir documentos</h2>
               <label for="archivo">Selecciona los documentos a subir:</label>
               <input type="file" id="archivo" name="archivos[]" multiple required>
               
            <button type="submit">Registrarme</button>
            <a href="index.html" class="volver">Volver al inicio</a>
        </form>
        <hr>
        <p class="registro">¿Ya tienes una cuenta? <a href="inicio.html">Iniciar sesión</a></p>
    </main>
</body>
</html>
