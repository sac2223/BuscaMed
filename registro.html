<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registro-BuscaMed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="contenedor registro-contenedor">
        <div class="logo"> 
          <span class="rojo">✚</span> BuscaMed
        </div>

        <h1> Registro de Farmacia</h1>

        <p> Registra tu farmacia para hacer parte de BuscaMed </p>

        <form>

            <label>Nombre de la Farmacia</label>
            <input type="text" placeholder="ej.Farmacia San Jose" required>

            <label>NIT</label>
            <input type="text" placeholder="ej. 123456789-0" required>

            <label>Dirección</label>
            <input type="address" placeholder="ej. Calle 123 # 45-67" required>

            <label>Ciudad</label>
            <select name="city" required>
                <option value="">Selecciona una ciudad</option>
                <option>Medellín</option>
                <option>Bogotá</option>
                <option>Cali</option>
                <option>Barranquilla</option>
                <option>Cartagena</option>
            </select>

            <label>Nombre del responsable</label>
            <input 
                type="text" 
                placeholder="Ej. Juan Pérez" required>

                  <label>Correo electrónico</label>
            <input 
                type="email" 
                placeholder="Ej. farmacia@correo.com" required
            >

            <label>Teléfono</label>
            <input 
                type="tel" 
                placeholder="Ej. 300 123 4567" required
            >

            <label>Contraseña</label>
            <input 
                type="password" 
                placeholder="Mínimo 8 caracteres" required
            >

            <button type="submit">
                Registrarme
            </button>

        </form>

          <hr>

        <p class="registro">
            ¿Ya tienes una cuenta?
            <a href="inicio.html">Iniciar sesión</a>
        </p>
        
    </div>
</body>
</html>>
